<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Open Doors College Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one column, a big sticky switcher across three working prototypes; each prototype opens with a one-line pitch. */
:root{
  --bg:#f6f7fb; --surface:#ffffff; --ink:#14213d; --muted:#56607a; --line:#dde1ec;
  --accent:#f2a516; --accent-ink:#3d2a00; --sky:#2f6fd6; --sky-soft:#e6eefc;
  --good:#1f8a5b; --good-soft:#e3f4ec; --warn:#b8580c; --warn-soft:#fdeedf; --off:#8a90a3; --off-soft:#eef0f4;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --surface:#172036; --ink:#eef1f8; --muted:#a3abc0; --line:#2a3550;
  --accent:#f5b43a; --accent-ink:#2b1d00; --sky:#7aa7f5; --sky-soft:#1d2c4d;
  --good:#5fd19c; --good-soft:#163a2c; --warn:#f3a565; --warn-soft:#40291a; --off:#8d94a8; --off-soft:#222b40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#172036; --ink:#eef1f8; --muted:#a3abc0; --line:#2a3550;
  --accent:#f5b43a; --accent-ink:#2b1d00; --sky:#7aa7f5; --sky-soft:#1d2c4d;
  --good:#5fd19c; --good-soft:#163a2c; --warn:#f3a565; --warn-soft:#40291a; --off:#8d94a8; --off-soft:#222b40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.hero{padding-block:40px 20px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,56px);line-height:1.02;margin:8px 0 12px;text-wrap:balance;letter-spacing:-.02em}
h1 .door{background:var(--accent);color:var(--accent-ink);padding:0 .18em;border-radius:6px}
.lede{max-width:62ch;color:var(--muted);font-size:18px;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.switch{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line)}
nav.switch .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
nav.switch button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer;min-width:0}
nav.switch button b{display:block;font-family:var(--display);font-size:18px;line-height:1.15}
nav.switch button span{font-size:13px;color:var(--muted)}
nav.switch button[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--accent)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
section.idea{padding-block:28px 64px}
.pitch{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin-bottom:20px}
.pitch h2{font-family:var(--display);font-size:clamp(26px,4vw,36px);margin:0;letter-spacing:-.01em}
.pitch p{margin:0;color:var(--muted);max-width:60ch}
.why{background:var(--sky-soft);border-radius:12px;padding:12px 16px;font-size:15px;margin-bottom:22px}
.why b{color:var(--sky)}
.label{font-weight:700;font-size:14px;margin:0 0 8px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:16px;padding:9px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.controls{display:grid;gap:18px;margin-bottom:22px}
.bigcount{font-family:var(--display);font-size:22px;margin:6px 0 16px}
.bigcount strong{font-size:44px;line-height:1;margin-right:8px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-family:var(--display);font-size:19px;line-height:1.2;margin:0}
.card .amt{font-family:var(--display);font-weight:800;font-size:26px;color:var(--ink);line-height:1.1;overflow-wrap:anywhere}
.card p{margin:0;font-size:15px;color:var(--muted)}
.card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:6px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.open{background:var(--good-soft);color:var(--good)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.closed,.pill.check{background:var(--off-soft);color:var(--off)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--off-soft);color:var(--muted)}
a.go{font-weight:700;color:var(--sky);text-decoration:none}
a.go:hover{text-decoration:underline}
.toggle{display:flex;align-items:center;gap:10px;font-size:16px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--ink)}
/* states */
.states{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.state{font:inherit;text-align:left;cursor:pointer;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.state b{display:block;font-family:var(--display);font-size:20px}
.state span{font-size:13px;color:var(--muted)}
.state[aria-pressed="true"]{border-color:var(--ink);background:var(--accent);color:var(--accent-ink)}
.state[aria-pressed="true"] span{color:var(--accent-ink)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:22px 0 12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat strong{font-family:var(--display);font-size:38px;display:block;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:15px}
.law{border-left:4px solid var(--accent);padding:6px 14px;margin:0 0 18px;max-width:75ch}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .nm{font-weight:700}
.li .sub{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.yn{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.filters{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;margin-bottom:12px}
/* trips */
.trip{position:relative}
.trip .when{display:flex;gap:12px;align-items:center}
.cal{flex:none;width:58px;border-radius:10px;overflow:hidden;text-align:center;border:1px solid var(--line);background:var(--bg)}
.cal i{display:block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;background:var(--ink);color:var(--bg);padding:2px 0}
.cal b{display:block;font-family:var(--display);font-size:24px;line-height:1.3}
.perks{display:flex;flex-wrap:wrap;gap:6px}
.perk{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--good-soft);color:var(--good)}
.perk.no{background:var(--off-soft);color:var(--off);font-weight:400}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 18px;margin-bottom:18px;font-size:17px}
.banner b{font-family:var(--display)}
footer{color:var(--muted);font-size:14px;padding-block:24px 48px;border-top:1px solid var(--line)}
@media (max-width:640px){
  nav.switch button span{display:none}
  nav.switch button b{font-size:16px}
  .li{grid-template-columns:1fr}
  .yn{justify-content:flex-start}
}
@media (prefers-reduced-motion:no-preference){.card,.state,.chip{transition:background .15s,border-color .15s,transform .15s}.card:hover{transform:translateY(-2px)}}
</style>

<style>
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font:inherit;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);cursor:pointer;padding:0;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand .mark svg{width:20px;height:20px;stroke:var(--accent-ink)}
.brand b{font-family:var(--display);font-size:20px;white-space:nowrap}
.lang{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;flex:none}
.lang button{font:inherit;font-weight:700;font-size:14px;padding:5px 12px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:640px}
.tabbar button{font:inherit;font-size:13px;font-weight:700;background:none;border:0;color:var(--muted);cursor:pointer;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.tabbar svg{width:24px;height:24px;stroke:currentColor}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] svg{background:var(--accent);stroke:var(--accent-ink);border-radius:999px;padding:2px 14px;box-sizing:content-box}
.tabbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
svg.i{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* home */
.home-hero{padding-block:32px 8px}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:22px 0 30px}
.door-card{font:inherit;text-align:left;cursor:pointer;border:0;border-radius:18px;padding:20px;color:var(--ink);display:flex;flex-direction:column;gap:6px;min-height:170px}
.door-card svg{width:34px;height:34px;stroke:currentColor;margin-bottom:6px}
.door-card .n{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.door-card .n{margin-top:4px}
.door-card .t{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.15}
.door-card .s{font-size:15px;opacity:.85}
.door-card .go2{margin-top:auto;font-weight:700}
.d-money{background:var(--accent);color:var(--accent-ink)}
.d-col{background:var(--sky-soft)}
.d-trip{background:var(--good-soft)}
@media (prefers-reduced-motion:no-preference){.door-card{transition:transform .15s}.door-card:hover{transform:translateY(-3px)}}
h2.sec{font-family:var(--display);font-size:24px;margin:0 0 12px}
.soon-list{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.soon-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.soon-item:first-child{border-top:0}
.soon-item .nm{font-weight:700}
.soon-item .sub{font-size:14px;color:var(--muted)}
.parents{margin-top:26px;border-left:4px solid var(--accent);padding:4px 16px;max-width:70ch}
/* section pages */
.page-head{padding-block:22px 6px}
.page-head h1{font-size:clamp(30px,5vw,44px);margin:0 0 6px}
.page-head p{margin:0;color:var(--muted);max-width:62ch;font-size:17px}
.back{font:inherit;font-weight:700;background:none;border:0;color:var(--sky);cursor:pointer;padding:6px 0;margin-bottom:6px}
.search{width:100%;font:inherit;font-size:17px;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.search:focus{border-color:var(--ink);outline:none}
.note{font-size:14px;color:var(--muted);margin:0}
.steps{display:flex;gap:10px;align-items:center;margin:18px 0 8px;font-family:var(--display);font-size:19px;font-weight:700}
.steps i{font-style:normal;width:30px;height:30px;border-radius:999px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:15px;flex:none}
section.view{padding-bottom:40px}
</style>

<header class="top">
  <div class="wrap">
    <button class="brand" data-go="home" aria-label="Home"><span class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v17"/><path d="M3 21h18"/><circle cx="15" cy="12" r="1"/></svg></span><b>Open Doors</b></button>
    <div class="lang" role="group" aria-label="Language / Idioma">
      <button id="l-en" data-l="en" aria-pressed="true">English</button>
      <button id="l-es" data-l="es" aria-pressed="false">Español</button>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- HOME -->
  <section class="view" id="v-home">
    <div class="home-hero">
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="h1"></h1>
      <p class="lede" data-t="lede"></p>
    </div>
    <div class="doors">
      <button class="door-card d-money" data-go="money">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/></svg>
        <span class="t" data-t="dMoney"></span><span class="n" id="nMoney"></span><span class="s" data-t="dMoneySub"></span><span class="go2" data-t="open"></span>
      </button>
      <button class="door-card d-col" data-go="colleges">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 10 12 4l9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>
        <span class="t" data-t="dCol"></span><span class="n" id="nCol"></span><span class="s" data-t="dColSub"></span><span class="go2" data-t="open"></span>
      </button>
      <button class="door-card d-trip" data-go="trips">
        <svg class="i" viewBox="0 0 24 24"><path d="M10.5 13.5 3 11l1.5-1.5 7 1 4-4.5c1-1 2.6-1.4 3.2-.7s.3 2.2-.7 3.2l-4.5 4 1 7L12 21l-2.5-7.5Z"/></svg>
        <span class="t" data-t="dTrip"></span><span class="n" id="nTrip"></span><span class="s" data-t="dTripSub"></span><span class="go2" data-t="open"></span>
      </button>
    </div>
    <h2 class="sec" data-t="soonTitle"></h2>
    <div class="soon-list" id="soonList"></div>
    <p class="parents" data-t="parents"></p>
  </section>

  <!-- MONEY -->
  <section class="view" id="v-money" hidden>
    <div class="page-head">
      <button class="back" data-go="home" data-t="back"></button>
      <h1 data-t="mTitle"></h1>
      <p data-t="mSub"></p>
    </div>
    <div class="steps"><i>1</i><span data-t="step1"></span></div>
    <div class="chips" id="interests"></div>
    <div class="steps"><i>2</i><span data-t="step2"></span></div>
    <div class="controls">
      <input class="search" id="qMoney" type="search" autocomplete="off">
      <label class="toggle"><input type="checkbox" id="openOnly" checked> <span data-t="hideClosed"></span></label>
      <p class="note" data-t="enNote"></p>
    </div>
    <div class="bigcount" id="schCount"></div>
    <div class="grid" id="schGrid"></div>
  </section>

  <!-- COLLEGES -->
  <section class="view" id="v-colleges" hidden>
    <div class="page-head">
      <button class="back" data-go="home" data-t="back"></button>
      <h1 data-t="bTitle"></h1>
      <p data-t="bPitch"></p>
    </div>
    <div class="steps"><i>1</i><span data-t="pickState"></span></div>
    <div class="states" id="states"></div>
    <div id="stateBody"></div>
  </section>

  <!-- TRIPS -->
  <section class="view" id="v-trips" hidden>
    <div class="page-head">
      <button class="back" data-go="home" data-t="back"></button>
      <h1 data-t="cTitle"></h1>
      <p data-t="cPitch"></p>
    </div>
    <div class="banner" id="tripBanner" style="margin-top:16px"></div>
    <div class="controls">
      <div><p class="label" data-t="showTrips"></p><div class="chips" id="perkChips"></div></div>
    </div>
    <div class="grid" id="tripGrid"></div>
  </section>

  <footer data-t="footer"></footer>
</main>

<nav class="tabbar" aria-label="Main">
  <div class="wrap">
    <button data-go="home"><svg class="i" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg><span data-t="navHome"></span></button>
    <button data-go="money"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/></svg><span data-t="navMoney"></span></button>

    <button data-go="trips"><svg class="i" viewBox="0 0 24 24"><path d="M10.5 13.5 3 11l1.5-1.5 7 1 4-4.5c1-1 2.6-1.4 3.2-.7s.3 2.2-.7 3.2l-4.5 4 1 7L12 21l-2.5-7.5Z"/></svg><span data-t="navTrip"></span></button>
  </div>
</nav>

  bannerOpen:n=>`<b>Todavía quedan ${n} fechas límite.</b> Estudiantes de último año: soliciten esta semana.`,
  bannerJr:'<b>Esto es para los de penúltimo año (11.º grado).</b> Las fechas de este año ya pasaron. La mayoría de los programas abren otra vez el próximo verano y cierran entre julio y septiembre. Apúntenlo en el calendario desde ahora.',
  passed:(m,y)=>'Ya cerró · la próxima ~'+m+' '+y,applyBy:d=>'Solicita antes del '+d,
  noTrip:'Ningún programa tiene todo eso. Prueba con menos filtros.',
  footer:'De la guía compartida de recursos universitarios y becas. Siempre revisen el sitio web de cada programa para ver las fechas y requisitos actuales.',
  mon:['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],
  md:(d,m)=>d.getDate()+' '+m[d.getMonth()], full:(d,m)=>d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear()
}};
let lang='en';
try{const s=localStorage.getItem('lang');if(s==='es'||s==='en')lang=s}catch(e){}
const L=()=>STR[lang];
const md=d=>L().md(d,L().mon), full=d=>L().full(d,L().mon);
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isoDate=s=>/^\d{4}-\d\d-\d\d$/.test(s)?new Date(s+'T00:00:00'):null;
const yes=v=>/^yes/i.test(v||'');
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

/* ---------- navigation ---------- */
const views=['home','money','colleges','trips'];
function show(v,scroll){
  if(!views.includes(v))v='home';
  views.forEach(x=>$('#v-'+x).hidden=x!==v);
  document.querySelectorAll('.tabbar button').forEach(b=>b.dataset.go===v?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  if(scroll)scrollTo({top:0});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;const v=b.dataset.go;if(location.hash.slice(1)!==v)location.hash=v;show(v,true)});
addEventListener('hashchange',()=>show(location.hash.slice(1),true));

function applyStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>{const v=L()[el.dataset.t];el.innerHTML=v;if(el.classList.contains('note'))el.hidden=!v});
  ['en','es'].forEach(x=>$('#l-'+x).setAttribute('aria-pressed',x===lang));
  $('#qMoney').placeholder=L().search;$('#qMoney').setAttribute('aria-label',L().search);
}
function renderAll(){applyStatic();renderHome();renderChips();renderSch();renderStates();renderState();renderPerks();renderTrips()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('lang',lang)}catch(e){}renderAll()});

/* ---------- home ---------- */
function renderHome(){
  $('#nMoney').textContent=DATA.sch.length;
  $('#nCol').textContent=Object.values(DATA.states).reduce((n,s)=>n+s.c.filter(c=>yes(c.au)).length,0);
  $('#nTrip').textContent=DATA.fly.length;
  const soon=DATA.sch.map(s=>({...s,d:isoDate(s.dl)})).filter(s=>s.d&&s.d>=TODAY).sort((a,b)=>a.d-b.d).slice(0,4);
  $('#soonList').innerHTML=soon.length?soon.map(s=>`<div class="soon-item">
      <div class="cal" aria-hidden="true"><i>${L().mon[s.d.getMonth()].toUpperCase()}</i><b>${s.d.getDate()}</b></div>
      <div style="min-width:0"><div class="nm" lang="en">${esc(s.n)}</div><div class="sub">${esc(amtText(s.a))}</div></div>
      ${s.u?`<a class="go" href="${esc(s.u)}" target="_blank" rel="noopener">${L().apply}</a>`:''}
    </div>`).join(''):`<div class="soon-item"><span></span><div class="sub">${L().noneSoon}</div><span></span></div>`;
}

/* ---------- scholarships ---------- */
function schStatus(s){
  const d=isoDate(s.dl);
  if(d){const days=(d-TODAY)/864e5;
    if(days<0)return{k:'closed',t:L().closedWas(md(d))};
    if(days<=45)return{k:'soon',t:L().due(md(d))};
    return{k:'open',t:L().due(full(d))};}
  const t=s.dl.toLowerCase();
  if(t.startsWith('rolling'))return{k:'open',t:L().anytime};
  if(/closed|2026 year|was|look for 2027|look out for 2027/.test(t))return{k:'closed',t:L().watch};
  return{k:'check',t:L().check};
}
const INTERESTS=['STEM','Health','Business','Arts','Law','Teaching','Latino/a','Black','Women','DACA / Undocumented','Rolling'];
const picked=new Set();
function renderChips(){$('#interests').innerHTML=INTERESTS.map(i=>`<button class="chip" aria-pressed="${picked.has(i)}" data-i="${esc(i)}">${esc(L().tags[i])}</button>`).join('')}
$('#interests').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const i=b.dataset.i;picked.has(i)?picked.delete(i):picked.add(i);b.setAttribute('aria-pressed',picked.has(i));renderSch()};
$('#openOnly').onchange=()=>renderSch();
$('#qMoney').oninput=()=>renderSch();
const amtNum=a=>{const m=String(a).replace(/,/g,'').match(/\d+/g);return m?Math.max(...m.map(Number)):0};
function amtText(a){
  if(/^\$/.test(a))return a;
  if(/^up to/i.test(a))return lang==='es'?a.replace(/^up to/i,'Hasta').replace(/over three years/i,'en tres años'):a;
  return a&&a.length<24&&!/^varies|^look/i.test(a)?a:L().amtVaries;
}
function renderSch(){
  const q=norm($('#qMoney').value.trim());
  let list=DATA.sch.map(s=>({...s,st:schStatus(s)}));
  if(picked.size)list=list.filter(s=>s.t.some(t=>picked.has(t)));
  if(q)list=list.filter(s=>norm(s.n+' '+s.d+' '+s.e).includes(q));
  if($('#openOnly').checked)list=list.filter(s=>s.st.k!=='closed');
  const rank={soon:0,open:1,check:2,closed:3};
  list.sort((a,b)=>rank[a.st.k]-rank[b.st.k]||amtNum(b.a)-amtNum(a.a));
  $('#schCount').innerHTML=L().count(list.length,picked.size>0||!!q);
  $('#schGrid').innerHTML=list.map(s=>`<article class="card">
    <div class="amt">${esc(amtText(s.a))}</div>
    <h3 lang="en">${esc(s.n)}</h3>
    <p lang="en">${esc(s.d)}</p>
    ${s.t.length?`<div class="tags">${s.t.map(t=>`<span class="tag">${esc(L().tags[t])}</span>`).join('')}</div>`:''}
    <div class="foot"><span class="pill ${s.st.k}">${esc(s.st.t)}</span>${s.u?`<a class="go" href="${esc(s.u)}" target="_blank" rel="noopener">${L().apply}</a>`:''}</div>
  </article>`).join('')||`<p>${L().noSch}</p>`;
}

/* ---------- colleges ---------- */
const stateNames=Object.keys(DATA.states);
let curState='California';
const sf={undoc:false,pub:false,q:''};
function renderStates(){$('#states').innerHTML=stateNames.map(n=>`<button class="state" aria-pressed="${n===curState}" data-s="${esc(n)}"><b>${esc(n==='Outside the Southwest'?L().other:n)}</b><span>${L().colleges(DATA.states[n].c.length)}</span></button>`).join('')}
$('#states').onclick=e=>{const b=e.target.closest('.state');if(!b)return;curState=b.dataset.s;sf.q='';document.querySelectorAll('.state').forEach(x=>x.setAttribute('aria-pressed',x.dataset.s===curState));renderState()};
function pill(v,label){
  const t=(v||'').toLowerCase();
  if(t.includes('private'))return`<span class="pill check">${label}: ${L().private}</span>`;
  if(yes(v))return`<span class="pill open">${label} ✓</span>`;
  if(/^no/.test(t))return`<span class="pill closed">${label} ✗</span>`;
  return v?`<span class="pill soon" title="${esc(v)}">${label}: ${L().ask}</span>`:'';
}
function collegeRows(c){
  return c.map(x=>`<div class="li">
      <div style="min-width:0"><div class="nm">${esc(x.n)}</div><div class="sub">${esc(x.l)} · ${esc(L().types[x.ty]||x.ty)}</div></div>
      <div class="sub">${esc(x.c)}</div>
      <div class="yn">${pill(x.au,L().admits)}${pill(x.iu,L().instate)}</div>
    </div>`).join('')||`<div class="li">${L().noCol}</div>`;
}
function filteredColleges(){
  let c=DATA.states[curState].c;
  if(sf.undoc)c=c.filter(x=>yes(x.au));
  if(sf.pub)c=c.filter(x=>/public/i.test(x.ty));
  if(sf.q){const q=norm(sf.q);c=c.filter(x=>norm(x.n+' '+x.l).includes(q))}
  return c;
}
function renderState(){
  const S=DATA.states[curState],all=S.c;
  const admit=all.filter(x=>yes(x.au)).length,instate=all.filter(x=>yes(x.iu)).length,aid=all.filter(x=>yes(x.aid)||/all eligible/i.test(x.aid)).length;
  $('#stateBody').innerHTML=`
    <div class="summary">
      <div class="stat"><strong>${admit}</strong><span>${L().statAdmit}</span></div>
      <div class="stat"><strong>${instate}</strong><span>${L().statInstate}</span></div>
      <div class="stat"><strong>${aid}</strong><span>${L().statAid}</span></div>
    </div>
    ${S.law?`<p class="law"><b>${L().stateRule}</b> <span lang="en">${esc(S.law)}</span></p>`:''}
    <div class="controls">
      <input class="search" id="qCol" type="search" autocomplete="off" placeholder="${esc(L().colSearch)}" aria-label="${esc(L().colSearch)}" value="${esc(sf.q)}">
      <div class="filters" style="margin:0">
        <label class="toggle"><input type="checkbox" id="fUndoc" ${sf.undoc?'checked':''}> ${L().fUndoc}</label>
        <label class="toggle"><input type="checkbox" id="fPub" ${sf.pub?'checked':''}> ${L().fPub}</label>
      </div>
    </div>
    <div class="list" id="colList">${collegeRows(filteredColleges())}</div>`;
  $('#fUndoc').onchange=e=>{sf.undoc=e.target.checked;$('#colList').innerHTML=collegeRows(filteredColleges())};
  $('#fPub').onchange=e=>{sf.pub=e.target.checked;$('#colList').innerHTML=collegeRows(filteredColleges())};
  $('#qCol').oninput=e=>{sf.q=e.target.value.trim();$('#colList').innerHTML=collegeRows(filteredColleges())};
}

/* ---------- trips ---------- */
const PERKS=['tr','gu','fw'];
const pk=new Set();
function renderPerks(){$('#perkChips').innerHTML=PERKS.map(k=>`<button class="chip" aria-pressed="${pk.has(k)}" data-k="${k}">${L().perks[k]}</button>`).join('')}
$('#perkChips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const k=b.dataset.k;pk.has(k)?pk.delete(k):pk.add(k);b.setAttribute('aria-pressed',pk.has(k));renderTrips()};
function renderTrips(){
  const all=DATA.fly.map(f=>({...f,desc:f.d,d:isoDate(f.dl)}));
  const upcoming=all.filter(f=>f.d&&f.d>=TODAY).length;
  $('#tripBanner').innerHTML=upcoming?L().bannerOpen(upcoming):L().bannerJr;
  let list=all.filter(f=>[...pk].every(k=>yes(f[k])));
  list.sort((a,b)=>(a.d?a.d.getMonth()*31+a.d.getDate():999)-(b.d?b.d.getMonth()*31+b.d.getDate():999));
  $('#tripGrid').innerHTML=list.map(f=>{
    const cal=f.d?`<div class="cal" aria-hidden="true"><i>${L().mon[f.d.getMonth()].toUpperCase()}</i><b>${f.d.getDate()}</b></div>`:'';
    const passed=f.d&&f.d<TODAY;
    const status=f.d?(passed?L().passed(L().mon[f.d.getMonth()],f.d.getFullYear()+1):L().applyBy(full(f.d))):L().check;
    return`<article class="card trip">
      <div class="when">${cal}<div style="min-width:0"><h3>${esc(f.n)}</h3><p>${esc(f.l)}</p></div></div>
      <p lang="en">${esc(f.desc||f.w)}</p>
      <div class="perks">${PERKS.map(k=>`<span class="perk ${yes(f[k])?'':'no'}">${yes(f[k])?'✓ ':''}${L().perks[k]}</span>`).join('')}</div>
      <div class="foot"><span class="pill ${passed?'closed':'open'}">${status}</span>${f.u?`<a class="go" href="${esc(f.u)}" target="_blank" rel="noopener">${L().details}</a>`:''}</div>
    </article>`}).join('')||`<p>${L().noTrip}</p>`;
}

renderAll();
show(location.hash.slice(1));
</script>

</html>
